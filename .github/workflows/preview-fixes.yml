name: Publish preview-only fixes
on:
  push:
    branches: [preview-fixes]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-fixes-pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/preview-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-fixes
          fetch-depth: 0
      - name: Apply audited preview source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/preview-fixes.patch <<'PATCH'
          diff --git a/src/components/DetailPage.astro b/src/components/DetailPage.astro
          index 3a98a6b..c843817 100644
          --- a/src/components/DetailPage.astro
          +++ b/src/components/DetailPage.astro
          @@ -19,7 +19,7 @@ const img = pageImage(h1);
               <section class={`sec sec-prose sec-${i % 2 ? 'a' : 'b'}`}><div class="sec-in">
                 <h2>{s.h}</h2>
                 {s.ps.map((p) => <p set:html={fixHref(p)} />)}
          -      {i === 0 && !legal && <figure class="sec-fig"><img src={u(img.src)} alt={img.alt} width="1200" height="896" loading="lazy" decoding="async" /><figcaption>Illustrative image, not a photo of a local job.</figcaption></figure>}
          +      {i === 0 && !legal && <figure class="sec-fig"><img src={u(img.src)} alt={img.alt} width="1200" height="896" loading="lazy" decoding="async" /></figure>}
               </div></section>
             ))}
             {related.length > 0 && <section class="sec sec-prose sec-a"><div class="sec-in">{related.map((r) => <a href={u(r.href)}>{r.label} &rarr;</a>)}</div></section>}
          diff --git a/src/components/Hero.astro b/src/components/Hero.astro
          index 2477444..b0108cb 100644
          --- a/src/components/Hero.astro
          +++ b/src/components/Hero.astro
          @@ -18,7 +18,6 @@ const { headline, intro, crumbs = [], home = false, location = home ? 'Homepage'
                 <a class="btn btn-primary" href={business.phoneHref} aria-label={`Call ${business.name} at ${business.phoneDisplay}`}>{business.phoneDisplay}</a>
                 <a class="btn btn-ghost" href="#request-service">Request a Call</a>
               </div>
          -    {home && <p class="image-note">Illustrative image, not a photo of a local job.</p>}
             </div><RequestForm location={location} /></div>
             {skin.wave && home && <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80L60 70C120 60 240 40 360 35C480 30 600 40 720 45C840 50 960 50 1080 45C1200 40 1320 30 1380 25L1440 20V80H0Z" fill="#f8fafc" /></svg>}
           </section>
          PATCH
          if git apply --check /tmp/preview-fixes.patch; then
            git apply /tmp/preview-fixes.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src
            git commit -m 'Remove preview image disclaimers and update service cards'
            git push origin HEAD:preview-fixes
          elif git apply --reverse --check /tmp/preview-fixes.patch; then
            echo 'Preview source patch already applied.'
          else
            echo 'Preview patch no longer matches source. Review required.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /huber-heights-hydro-jetting-pros
          SITE_BASE: /huber-heights-hydro-jetting-pros
      - name: Publish only GitHub Pages preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
